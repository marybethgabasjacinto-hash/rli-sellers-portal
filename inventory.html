<!-- UNIT DETAILS POPUP -->

<div id="unitModal"
     class="modal"
     onclick="closeOutside(event)">

    <div class="modal-content">

        <span class="close"
              onclick="closeUnitDetails()">
            &times;
        </span>

        <h2>UNIT DETAILS</h2>

        <div class="unit-info">

            <!-- MIDDLE HOUSING -->

            <div id="housingDetails">

                <p>
                    <strong>Project:</strong>
                    <span id="detailProject"></span>
                </p>

                <p>
                    <strong>Lot Alias:</strong>
                    <span id="detailLotAlias"></span>
                </p>

                <p>
                    <strong>Block:</strong>
                    <span id="detailBlock"></span>
                </p>

                <p>
                    <strong>Lot:</strong>
                    <span id="detailLot"></span>
                </p>

                <p>
                    <strong>Lot Area:</strong>
                    <span id="detailLotArea"></span>
                </p>

                <p>
                    <strong>Floor Area:</strong>
                    <span id="detailFloorArea"></span>
                </p>

                <p>
                    <strong>House Model:</strong>
                    <span id="detailHouseModel"></span>
                </p>

                <p>
                    <strong>Gross Contract Price:</strong>
                    <span id="detailPrice"></span>
                </p>

            </div>


            <!-- MIDDLE CONDO -->

            <div id="condoDetails" style="display:none;">

                <p>
                    <strong>Project:</strong>
                    <span id="condoProject"></span>
                </p>

                <p>
                    <strong>Lot Alias:</strong>
                    <span id="condoLotAlias"></span>
                </p>

                <p>
                    <strong>Building & Floor:</strong>
                    <span id="condoBuildingFloor"></span>
                </p>

                <p>
                    <strong>Unit Code:</strong>
                    <span id="condoUnitCode"></span>
                </p>

                <p>
                    <strong>Floor Area:</strong>
                    <span id="condoFloorArea"></span>
                </p>

                <p>
                    <strong>Unit Model:</strong>
                    <span id="condoUnitModel"></span>
                </p>

                <p>
                    <strong>Gross Contract Price:</strong>
                    <span id="condoPrice"></span>
                </p>

            </div>

        </div>


        <div class="modal-buttons">

            <button class="payment-button"
                    onclick="openPaymentCalculator()">
                PAYMENT CALCULATOR
            </button>

            <button class="hold-button"
                    onclick="holdUnit()">
                HOLD THIS UNIT
            </button>

        </div>

    </div>

</div>


<!-- INVENTORY DATA FIRST -->
<script src="inventory-data.js"></script>

<!-- MAIN JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
