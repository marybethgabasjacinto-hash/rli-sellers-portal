<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RLI Inventory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">

        <div>
            <h1>RLI Sellers Portal</h1>
            <p>Real-time Sales & Inventory</p>
        </div>

    </header>


    <!-- MAIN CONTENT -->
    <main class="container">

        <section class="welcome">
            <h2>Inventory</h2>
            <p>Select an available unit.</p>
        </section>


        <!-- PROJECT SELECTION -->
        <section class="project-card">

            <label for="projectSelect">PROJECT</label>

            <select id="projectSelect">
                <option value="">Select Project</option>
                <option value="AGAPEYA">AGAPEYA</option>
                <option value="VALENZIA ENCLAVE EAST">
                    VALENZIA ENCLAVE EAST
                </option>
                <option value="AGAPEYA WEST">
                    AGAPEYA WEST
                </option>
                <option value="ESTANZIA ENCLAVE EAST">
                    ESTANZIA ENCLAVE EAST
                </option>
                <option value="THE PENTHOUSE AT JEN">
                    THE PENTHOUSE AT JEN
                </option>
            </select>

        </section>


        <!-- BLOCK 1 -->
        <section class="block-card">

            <div class="block-title">
                <h2>BLOCK 1</h2>
                <span class="available-label">
                    AVAILABLE
                </span>
            </div>


            <div class="lot-grid">

                <button class="lot available"
                        onclick="showUnitDetails(1)">
                    1
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(2)">
                    2
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(3)">
                    3
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(4)">
                    4
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(5)">
                    5
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(6)">
                    6
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(7)">
                    7
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(8)">
                    8
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(9)">
                    9
                </button>

                <button class="lot available"
                        onclick="showUnitDetails(10)">
                    10
                </button>

            </div>

        </section>


        <!-- BACK BUTTON -->
        <button class="back-button"
                onclick="goBack()">

            ← Back to Dashboard

        </button>

    </main>


    <!-- ========================= -->
    <!-- UNIT DETAILS POPUP -->
    <!-- ========================= -->

    <div id="unitModal" class="modal">

        <div class="modal-content">

            <!-- CLOSE -->
            <button class="close-button"
                    onclick="closeUnitDetails()">
                ×
            </button>


            <div class="modal-header">

                <span class="unit-icon">
                    🏠
                </span>

                <div>
                    <h2>UNIT DETAILS</h2>
                    <p>Available Unit</p>
                </div>

            </div>


            <div class="details-box">

                <div class="detail-row">
                    <span>Project</span>
                    <strong id="detailProject">
                        AGAPEYA
                    </strong>
                </div>

                <div class="detail-row">
                    <span>Block</span>
                    <strong id="detailBlock">
                        1
                    </strong>
                </div>

                <div class="detail-row">
                    <span>Lot</span>
                    <strong id="detailLot">
                        1
                    </strong>
                </div>

                <div class="detail-row">
                    <span>Lot Area</span>
                    <strong id="detailLotArea">
                        100 sqm
                    </strong>
                </div>

                <div class="detail-row">
                    <span>Floor Area</span>
                    <strong id="detailFloorArea">
                        50 sqm
                    </strong>
                </div>

                <div class="detail-row">
                    <span>House Model</span>
                    <strong id="detailHouseModel">
                        Model A
                    </strong>
                </div>

                <div class="price-row">

                    <span>Price</span>

                    <strong id="detailPrice">
                        ₱3,500,000
                    </strong>

                </div>

            </div>


            <!-- ACTION BUTTONS -->

            <div class="modal-actions">

                <button class="payment-button"
                        onclick="openPaymentCalculator()">

                    💰 Payment Calculator

                </button>


                <button class="hold-button"
                        onclick="holdUnit()">

                    🔒 Hold This Unit

                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
