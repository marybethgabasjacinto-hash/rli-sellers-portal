<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RLI Sellers Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>RLI Sellers Portal</h1>
        <p>Real-time Sales & Inventory Portal</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome, Seller!</h2>
            <p>Manage your projects and check inventory.</p>
        </section>

        <section class="cards">

            <div class="card">
                <h3>PROJECTS</h3>
                <div class="number">5</div>
            </div>

            <div class="card">
                <h3>AVAILABLE UNITS</h3>
                <div class="number">128</div>
            </div>

            <div class="card">
                <h3>MY HOLDS</h3>
                <div class="number">12</div>
            </div>

        </section>

        <section class="actions">

            <button class="primary">
                Check Inventory
            </button>

            <button class="secondary">
                Payment Calculator
            </button>

        </section>

    </main>

</body>

</html>
