<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLI Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>RLI Sellers Portal</h1>
    <p>Real-time Sales & Inventory</p>
</header>

<main class="container">

    <section class="welcome">
        <h2>Inventory</h2>
        <p>Select an available unit.</p>
    </section>

    <section class="card">

        <h2>BLOCK 1</h2>

        <div class="lot-grid">

            <button type="button" class="lot" onclick="showUnitDetails(1)">1</button>
            <button type="button" class="lot" onclick="showUnitDetails(2)">2</button>
            <button type="button" class="lot" onclick="showUnitDetails(3)">3</button>
            <button type="button" class="lot" onclick="showUnitDetails(4)">4</button>
            <button type="button" class="lot" onclick="showUnitDetails(5)">5</button>
            <button type="button" class="lot" onclick="showUnitDetails(6)">6</button>
            <button type="button" class="lot" onclick="showUnitDetails(7)">7</button>
            <button type="button" class="lot" onclick="showUnitDetails(8)">8</button>
            <button type="button" class="lot" onclick="showUnitDetails(9)">9</button>
            <button type="button" class="lot" onclick="showUnitDetails(10)">10</button>

        </div>

    </section>

    <button type="button" class="secondary" onclick="goBack()">
        Back to Dashboard
    </button>

</main>


<!-- UNIT DETAILS -->

<div id="unitModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeUnitDetails()">&times;</span>

        <h2>UNIT DETAILS</h2>

        <p>Project: <span id="detailProject">AGAPEYA</span></p>
        <p>Block: <span id="detailBlock">1</span></p>
        <p>Lot: <span id="detailLot">3</span></p>
        <p>Lot Area: <span id="detailLotArea">100 sqm</span></p>
        <p>Floor Area: <span id="detailFloorArea">50 sqm</span></p>
        <p>House Model: <span id="detailHouseModel">Model A</span></p>
        <p>Price: <span id="detailPrice">₱3,500,000</span></p>

        <br>

        <button type="button" class="primary">
            PAYMENT CALCULATOR
        </button>

        <button type="button" class="hold-button">
            HOLD THIS UNIT
        </button>

    </div>

</div>


<script>

function showUnitDetails(lotNumber) {

    document.getElementById("detailLot").textContent = lotNumber;

    document.getElementById("unitModal").style.display = "flex";

}

function closeUnitDetails() {

    document.getElementById("unitModal").style.display = "none";

}

function goBack() {

    window.location.href = "index.html";

}

</script>

</body>
</html>
